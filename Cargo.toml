[package]
name = "pyzcash"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[lib]
name = "pyzcash"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
zcash_address = "0.13"
zcash_keys = { version = "0.16", features = ["orchard", "sapling"] }
zcash_protocol = "0.10"
# zcash_keys 0.16 still uses zip32 0.2; move with it.
zip32 = "0.2"
zip321 = "0.9"
